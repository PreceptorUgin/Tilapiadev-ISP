upstream portal-client03 {
    server portal-client03:80;
}
upstream wp-cliente3 {
    server wp-cliente3:80;
}

server {
    listen 80;
    server_name piaba.asa.isp;

    access_log  /var/log/nginx/access.log  main;
    error_log   /var/log/nginx/error.log   warn;

    location / {
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_redirect off;
        proxy_pass http://portal-client03;
    }
}

server {
    listen 80;
    server_name wp.piaba.asa.isp *.wp.piaba.asa.is;

    access_log  /var/log/nginx/access.log  main;
    error_log   /var/log/nginx/error.log   warn;

    location / {
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_redirect off;
        proxy_pass http://wp-cliente3;
    }
}